name: Python and MuJoCo smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Kinematics tests
        run: python -m pytest -q
      - name: Validate URDF and configuration syntax
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import yaml
          ET.parse("ros2_ws/src/three_r_description/urdf/three_r.urdf.xacro")
          with open("config/robot.yaml", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("URDF XML and robot YAML are well formed")
          PY
      - name: MuJoCo primitive-model smoke test
        run: python mujoco/run_simulation.py --primitive --no-viewer
